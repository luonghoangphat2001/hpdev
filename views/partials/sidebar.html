<!-- Sidebar Navigation Component -->
<aside id="app-sidebar" class="app-sidebar bg-gray-800 flex flex-col border-r border-gray-700 shrink-0">
  <div class="sidebar-header px-3 py-4 border-b border-gray-700 flex items-center justify-between gap-1">
    <div class="flex items-center gap-2">
      <div class="w-7 h-7 rounded-full overflow-hidden shrink-0" style="width: 28px; height: 28px; min-width: 28px; min-height: 28px;">
        <img src="/images/dan.png" alt="Đần" width="28" height="28" class="dan-logo-img w-full h-full object-cover rounded-full" style="width: 28px; height: 28px; aspect-ratio: 1/1;" loading="eager" decoding="sync" />
      </div>
      <span class="sidebar-label font-bold text-white text-sm">Đần AI</span>
    </div>
    <div class="flex items-center gap-1">
      <span class="sidebar-version text-[10px] font-mono px-1.5 py-0.5 rounded bg-gray-700/80 text-gray-400 font-semibold" title="Version">v{{VERSION}}</span>
      <button id="sidebar-collapse-btn" data-action="sidebar.toggleCollapse" type="button" class="hidden md:flex w-6 h-6 rounded-md bg-gray-700 hover:bg-indigo-600 text-gray-200 transition items-center justify-center" aria-label="Thu gọn sidebar" aria-expanded="true" title="Thu gọn sidebar">«</button>
      <button id="sidebar-mobile-close-btn" data-action="sidebar.closeMobile" type="button" class="md:hidden w-7 h-7 rounded-lg bg-gray-700 hover:bg-red-600 active:bg-red-700 text-gray-200 transition flex items-center justify-center" aria-label="Đóng sidebar" title="Đóng sidebar">✕</button>
    </div>
  </div>

  <nav class="flex-1 px-2 py-3 space-y-0.5 overflow-y-auto overscroll-contain">
    <a href="/chat" id="nav-chat" class="nav-item w-full text-left px-3 py-2.5 rounded-lg text-sm font-medium transition-colors flex items-center gap-2.5 {{NAV_ACTIVE_CHAT}}">
      <span class="sidebar-icon">💬</span><span class="sidebar-label">Chat</span>
    </a>

    <details id="sidebar-learning-menu" class="sidebar-dropdown-menu">
      <summary id="nav-learning" class="nav-item w-full text-left px-3 py-2.5 rounded-lg text-sm font-medium transition-colors flex items-center gap-2.5 cursor-pointer select-none {{NAV_ACTIVE_LEARNING}}">
        <span class="sidebar-icon">🎓</span>
        <span class="sidebar-label flex-1">Learning</span>
        <span class="sidebar-dropdown-chevron text-xs text-gray-400">⌄</span>
      </summary>
      <div class="sidebar-dropdown-submenu ml-7 pl-2 border-l border-gray-700 space-y-0.5 mt-0.5">
        <a href="/learning/tech/php" id="tab-btn-tech" class="nav-item w-full px-2 py-1.5 rounded-lg text-xs font-semibold transition flex items-center gap-2 text-gray-400 hover:bg-gray-700 hover:text-white">
          <span class="sidebar-icon">💻</span><span class="sidebar-label">Tech</span>
        </a>
        <a href="/learning/english/vocab" id="tab-btn-english" class="nav-item w-full px-2 py-1.5 rounded-lg text-xs font-semibold transition flex items-center gap-2 text-gray-400 hover:bg-gray-700 hover:text-white">
          <span class="sidebar-icon">🇬🇧</span><span class="sidebar-label">English</span>
        </a>
      </div>
    </details>

    <!-- Admin-only nav -->
    <div id="admin-nav" class="pt-3 space-y-0.5">
      <div class="sidebar-section-label px-3 pb-1 text-xs font-semibold text-gray-500 uppercase tracking-wider">Management</div>
      <a href="/schedule" id="nav-schedule" class="nav-item w-full text-left px-3 py-2.5 rounded-lg text-sm font-medium transition-colors flex items-center gap-2.5 {{NAV_ACTIVE_SCHEDULE}}">
        <span class="sidebar-icon">📅</span><span class="sidebar-label">Schedule</span>
      </a>
      <details id="sidebar-config-menu" class="sidebar-dropdown-menu">
        <summary id="nav-config" class="nav-item w-full text-left px-3 py-2.5 rounded-lg text-sm font-medium transition-colors flex items-center gap-2.5 cursor-pointer select-none {{NAV_ACTIVE_CONFIG}}">
          <span class="sidebar-icon">⚙️</span>
          <span class="sidebar-label flex-1">Config</span>
          <span class="sidebar-dropdown-chevron text-xs text-gray-400">⌄</span>
        </summary>
        <div class="sidebar-dropdown-submenu ml-7 pl-2 border-l border-gray-700 space-y-0.5 mt-0.5">
          <a href="/config/models" data-config-sidebar-tab="models" class="config-sidebar-link nav-item w-full px-2 py-1.5 rounded-lg text-xs font-semibold transition flex items-center gap-2 text-gray-400 hover:bg-gray-700 hover:text-white">
            <span class="sidebar-icon">🤖</span><span class="sidebar-label">Models</span>
          </a>
          <a href="/config/providers" data-config-sidebar-tab="providers" class="config-sidebar-link nav-item w-full px-2 py-1.5 rounded-lg text-xs font-semibold transition flex items-center gap-2 text-gray-400 hover:bg-gray-700 hover:text-white">
            <span class="sidebar-icon">🔑</span><span class="sidebar-label">Providers</span>
          </a>
          <a href="/config/openclaw" data-config-sidebar-tab="openclaw" class="config-sidebar-link nav-item w-full px-2 py-1.5 rounded-lg text-xs font-semibold transition flex items-center gap-2 text-gray-400 hover:bg-gray-700 hover:text-white">
            <span class="sidebar-icon">🦅</span><span class="sidebar-label">AI Agents</span>
          </a>
          <a href="/config/prompts" data-config-sidebar-tab="prompts" class="config-sidebar-link nav-item w-full px-2 py-1.5 rounded-lg text-xs font-semibold transition flex items-center gap-2 text-gray-400 hover:bg-gray-700 hover:text-white">
            <span class="sidebar-icon">📝</span><span class="sidebar-label">Prompts</span>
          </a>
          <a href="/config/logs" data-config-sidebar-tab="logs" class="config-sidebar-link nav-item w-full px-2 py-1.5 rounded-lg text-xs font-semibold transition flex items-center gap-2 text-gray-400 hover:bg-gray-700 hover:text-white">
            <span class="sidebar-icon">🪵</span><span class="sidebar-label">Log Config</span>
          </a>
        </div>
      </details>
      <a href="/history" id="nav-history" class="nav-item w-full text-left px-3 py-2.5 rounded-lg text-sm font-medium transition-colors flex items-center gap-2.5 {{NAV_ACTIVE_HISTORY}}">
        <span class="sidebar-icon">📜</span><span class="sidebar-label">History</span>
      </a>
      <a href="/stats" id="nav-stats" class="nav-item w-full text-left px-3 py-2.5 rounded-lg text-sm font-medium transition-colors flex items-center gap-2.5 {{NAV_ACTIVE_STATS}}">
        <span class="sidebar-icon">📊</span><span class="sidebar-label">Stats</span>
      </a>
      <a href="/users" id="nav-users" class="nav-item w-full text-left px-3 py-2.5 rounded-lg text-sm font-medium transition-colors flex items-center gap-2.5 {{NAV_ACTIVE_USERS}}">
        <span class="sidebar-icon">👥</span><span class="sidebar-label">Users</span>
      </a>
      <a href="/openclaw" id="nav-openclaw" class="nav-item w-full text-left px-3 py-2.5 rounded-lg text-sm font-medium transition-colors flex items-center gap-2.5 {{NAV_ACTIVE_OPENCLAW}}">
        <span class="sidebar-icon">🦞</span><span class="sidebar-label">OpenClaw</span>
      </a>
      <a href="/logs" id="nav-logs" class="nav-item w-full text-left px-3 py-2.5 rounded-lg text-sm font-medium transition-colors flex items-center gap-2.5 {{NAV_ACTIVE_LOGS}}">
        <span class="sidebar-icon">📋</span><span class="sidebar-label">Logs</span>
      </a>
    </div>
  </nav>

  <!-- User profile + logout -->
  <div class="border-t border-gray-700 px-3 py-3 flex items-center gap-2.5">
    <div class="w-7 h-7 rounded-full bg-indigo-600 flex items-center justify-center text-xs font-bold shrink-0" id="user-avatar">{{USER_INITIAL}}</div>
    <div class="sidebar-user-details flex-1 min-w-0">
      <div class="text-sm font-medium truncate" id="user-name">{{USERNAME}}</div>
      <div class="text-xs text-gray-500 capitalize" id="user-role-label">{{ROLE}}</div>
    </div>
    <form method="POST" action="/logout">
      <button type="submit" title="Logout" class="text-gray-500 hover:text-white transition p-1 rounded hover:bg-gray-700">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          <polyline points="16 17 21 12 16 7" />
          <line x1="21" y1="12" x2="9" y2="12" />
        </svg>
      </button>
    </form>
  </div>
</aside>
