<!-- OpenClaw Integration -->
<div class="bg-gray-800/90 rounded-xl p-6 border border-gray-700/60 shadow-lg">
  <h2 class="font-semibold mb-1 text-gray-200 flex items-center gap-2">
    <span>🦞</span> OpenClaw Service Integration
  </h2>
  <p class="text-xs text-gray-400 mb-4">Tích hợp tìm kiếm Google Search và crawl tự động qua OpenClaw microservice.</p>
  <div class="space-y-4">
    <label class="flex items-center gap-3 cursor-pointer">
      <input type="checkbox" id="openclaw-enabled" class="w-4 h-4 accent-indigo-500" />
      <span class="text-sm text-gray-200 font-medium">Bật OpenClaw</span>
    </label>
    <div class="grid md:grid-cols-2 gap-4">
      <div>
        <label class="block text-xs text-gray-400 mb-1">OpenClaw Base URL</label>
        <input type="url" id="openclaw-url" placeholder="https://your-openclaw.example.com" class="w-full px-4 py-2.5 bg-gray-700 rounded-lg border border-gray-600 focus:border-indigo-500 focus:outline-none text-sm" />
      </div>
      <div>
        <label class="block text-xs text-gray-400 mb-1">Google Custom Search Engine ID (CX)</label>
        <input type="text" id="google-cx" placeholder="xxxxxxxxxxxxxxx:xxxxxxxxxx" class="w-full px-4 py-2.5 bg-gray-700 rounded-lg border border-gray-600 focus:border-indigo-500 focus:outline-none text-sm" />
      </div>
    </div>
  </div>
</div>
