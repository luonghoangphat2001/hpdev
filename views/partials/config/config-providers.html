<!-- AI Providers Configuration -->
<div class="grid md:grid-cols-2 gap-6">
  <div class="bg-gray-800/90 rounded-xl p-6 border border-gray-700/60 shadow-lg" id="gemini-model-wrap">
    <h2 class="font-semibold mb-1 text-gray-200 flex items-center gap-2">
      <span>🌟</span> Gemini Model
    </h2>
    <p class="text-xs text-gray-400 mb-4">Chọn phiên bản Google Gemini</p>
    <select id="gemini-model" class="w-full px-4 py-2.5 bg-gray-700 rounded-lg border border-gray-600 focus:border-indigo-500 focus:outline-none text-sm">
      <option value="models/gemini-2.5-flash">gemini-2.5-flash (Khuyên dùng)</option>
      <option value="models/gemini-2.0-flash">gemini-2.0-flash</option>
      <option value="models/gemini-1.5-pro">gemini-1.5-pro</option>
      <option value="models/gemini-1.5-flash">gemini-1.5-flash</option>
    </select>
  </div>

  <div class="bg-gray-800/90 rounded-xl p-6 border border-gray-700/60 shadow-lg" id="chatgpt-model-wrap">
    <h2 class="font-semibold mb-1 text-gray-200 flex items-center gap-2">
      <span>🤖</span> ChatGPT Model
    </h2>
    <p class="text-xs text-gray-400 mb-4">Chọn phiên bản OpenAI GPT</p>
    <select id="chatgpt-model" class="w-full px-4 py-2.5 bg-gray-700 rounded-lg border border-gray-600 focus:border-indigo-500 focus:outline-none text-sm">
      <option value="gpt-4o">gpt-4o (Khuyên dùng)</option>
      <option value="gpt-4o-mini">gpt-4o-mini</option>
      <option value="gpt-4-turbo">gpt-4-turbo</option>
      <option value="gpt-3.5-turbo">gpt-3.5-turbo</option>
    </select>
  </div>
</div>

<div class="bg-gray-800/90 rounded-xl p-6 border border-gray-700/60 shadow-lg" id="claude-model-wrap">
  <h2 class="font-semibold mb-1 text-gray-200 flex items-center gap-2">
    <span>✳️</span> Claude Model & Base URL
  </h2>
  <p class="text-xs text-gray-400 mb-4">Cấu hình phiên bản Anthropic Claude và Proxy Endpoint.</p>
  <div class="grid md:grid-cols-2 gap-4">
    <div>
      <label class="block text-xs text-gray-400 mb-1">Phiên bản Claude</label>
      <select id="claude-model" class="w-full px-4 py-2.5 bg-gray-700 rounded-lg border border-gray-600 focus:border-indigo-500 focus:outline-none text-sm">
        <optgroup label="Claude 4.6">
          <option value="claude-sonnet-4-6">Sonnet 4.6 (Khuyên dùng)</option>
          <option value="claude-opus-4-6">Opus 4.6</option>
        </optgroup>
        <optgroup label="Claude 4.5">
          <option value="claude-sonnet-4-5">Sonnet 4.5</option>
          <option value="claude-opus-4-5">Opus 4.5</option>
          <option value="claude-haiku-4-5-20251001">Haiku 4.5</option>
        </optgroup>
      </select>
    </div>
    <div id="claude-base-url-wrap">
      <label class="block text-xs text-gray-400 mb-1">Claude Base URL (Proxy)</label>
      <input type="url" id="claude-base-url" placeholder="https://your-claude-proxy.example.com/" class="w-full px-4 py-2.5 bg-gray-700 rounded-lg border border-gray-600 focus:border-indigo-500 focus:outline-none text-sm" />
    </div>
  </div>
</div>

<!-- Additional Providers -->
<div class="bg-gray-800/90 rounded-xl p-6 border border-gray-700/60 shadow-lg">
  <h2 class="font-semibold mb-1 text-gray-200 flex items-center gap-2">
    <span>🧩</span> Model các Provider bổ sung
  </h2>
  <p class="text-xs text-gray-400 mb-4">Cấu hình phiên bản model cho từng provider (DeepSeek, Kimi, vLLM, Ollama, NVIDIA, Cloudflare).</p>
  <div id="additional-model-config" class="grid md:grid-cols-2 gap-4"></div>
</div>
