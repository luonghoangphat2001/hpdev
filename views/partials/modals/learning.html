<!-- MODALS: UNIFIED LEARNING HUB -->

<!-- 1. AI CONTENT GENERATOR MODAL -->
<div id="learning-ai-generator-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
  <div class="bg-gray-800 rounded-2xl border border-gray-700 w-full max-w-2xl max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
    <div class="px-6 py-4 bg-gray-850 border-b border-gray-700 flex items-center justify-between">
      <h3 class="font-bold text-white text-base flex items-center gap-2">
        <span class="text-indigo-400">✨</span> Đần AI Generator
      </h3>
      <button data-action="learning.closeModal" data-action-args='["learning-ai-generator-modal"]' class="text-gray-400 hover:text-white text-xl leading-none">&times;</button>
    </div>

    <div class="p-6 space-y-4 overflow-y-auto flex-1 text-xs">
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-gray-400 mb-1 font-semibold">Phân hệ / Dạng nội dung</label>
          <select id="modal-ai-type" data-change-action="learning.onModalTypeChange" class="w-full px-3 py-2 bg-gray-900 rounded-xl border border-gray-700 text-white focus:outline-none">
            <option value="tech_question">💻 Tech Question (Phỏng vấn)</option>
            <option value="vocabulary">📖 Vocabulary Word (Từ vựng)</option>
            <option value="quiz">🧩 Quiz Trắc nghiệm</option>
            <option value="reading">📖 Reading Passage (Đọc hiểu)</option>
            <option value="writing">✍️ Writing Task (Luyện viết)</option>
            <option value="speaking">🗣️ Speaking Topic</option>
            <option value="ielts">🎯 IELTS Task (Writing/Speaking)</option>
          </select>
        </div>

        <div>
          <label id="modal-ai-learning-label" class="block text-gray-400 mb-1 font-semibold">Chủ đề / Stack</label>
          <select id="modal-ai-learning-slug" class="w-full px-3 py-2 bg-gray-900 rounded-xl border border-gray-700 text-white focus:outline-none"></select>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-gray-400 mb-1 font-semibold">Cấp độ (Level)</label>
          <select id="modal-ai-level" class="w-full px-3 py-2 bg-gray-900 rounded-xl border border-gray-700 text-white focus:outline-none">
            <option value="beginner">Beginner / A1-A2</option>
            <option value="junior">Junior / B1</option>
            <option value="intermediate" selected>Intermediate / B2 (Mid)</option>
            <option value="advanced">Advanced / C1 (Senior/Architect)</option>
            <option value="ielts_7.0">IELTS 7.0+</option>
          </select>
        </div>

        <div>
          <label class="block text-gray-400 mb-1 font-semibold">Số lượng tạo</label>
          <select id="modal-ai-count" class="w-full px-3 py-2 bg-gray-900 rounded-xl border border-gray-700 text-white focus:outline-none">
            <option value="5" selected>5 câu</option>
            <option value="10">10 câu</option>
            <option value="20">20 câu</option>
            <option value="30">30 câu</option>
          </select>
        </div>
      </div>

      <div>
        <label class="block text-gray-400 mb-1 font-semibold">Yêu cầu đặc biệt (Custom Prompt - Tùy chọn)</label>
        <textarea id="modal-ai-custom-prompt" rows="2" placeholder="Ví dụ: Tập trung vào Memory Leak, Docker optimization, Collocations giao tiếp công sở..."
          class="w-full px-3 py-2 bg-gray-900 rounded-xl border border-gray-700 text-white placeholder-gray-500 focus:outline-none resize-none"></textarea>
      </div>

      <button id="modal-ai-btn-submit" data-action="learning.submitAIGenerator"
        class="w-full py-2.5 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white rounded-xl font-bold transition shadow flex items-center justify-center gap-2">
        <span>✨</span> Bắt đầu tạo nội dung bằng AI
      </button>

      <!-- Preview Container -->
      <div id="modal-ai-preview-area" class="hidden pt-4 border-t border-gray-700 space-y-3">
        <div class="flex items-center justify-between">
          <span class="font-bold text-white text-xs">Xem trước kết quả sinh từ AI</span>
          <span class="text-xs text-indigo-400" id="modal-ai-preview-count">0 items</span>
        </div>
        <div id="modal-ai-preview-list" class="space-y-3 max-h-[260px] overflow-y-auto pr-1"></div>
        <button id="modal-ai-btn-save-batch" data-action="learning.saveAIGeneratedBatch"
          class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl font-bold transition shadow">
          💾 Lưu tất cả vào Ngân Hàng Học Tập
        </button>
      </div>
    </div>
  </div>
</div>

<!-- 2. AI EVALUATOR / MOCK INTERVIEW / IELTS GRADING MODAL -->
<div id="learning-evaluator-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
  <div class="bg-gray-800 rounded-2xl border border-gray-700 w-full max-w-3xl max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
    <div class="px-6 py-4 bg-gray-850 border-b border-gray-700 flex items-center justify-between">
      <h3 class="font-bold text-white text-base flex items-center gap-2" id="evaluator-modal-title">
        <span>🎯</span> AI Evaluator & Mock Interview
      </h3>
      <button data-action="learning.closeModal" data-action-args='["learning-evaluator-modal"]' class="text-gray-400 hover:text-white text-xl leading-none">&times;</button>
    </div>

    <div class="p-6 space-y-4 overflow-y-auto flex-1 text-xs">
      <div class="bg-gray-900/80 p-4 rounded-xl border border-gray-700/80 space-y-2">
        <span class="text-indigo-400 font-bold uppercase text-[10px] tracking-wider" id="evaluator-question-badge">Đề bài / Câu hỏi</span>
        <h4 class="text-sm font-bold text-white" id="evaluator-question-title">...</h4>
        <p class="text-gray-300 leading-relaxed text-xs" id="evaluator-question-prompt">...</p>
      </div>

      <div>
        <label class="block text-gray-400 mb-1 font-semibold">Câu trả lời / Bài làm của bạn:</label>
        <textarea id="evaluator-user-submission" rows="6" placeholder="Nhập câu trả lời chi tiết hoặc dán bài viết của bạn tại đây..."
          class="w-full px-4 py-3 bg-gray-900 rounded-xl border border-gray-700 text-white placeholder-gray-500 focus:outline-none resize-none leading-relaxed"></textarea>
      </div>

      <button id="evaluator-btn-submit" data-action="learning.submitAIEvaluation"
        class="w-full py-2.5 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white rounded-xl font-bold transition shadow flex items-center justify-center gap-2">
        <span>🤖</span> Đần AI Chấm Điểm & Nhận Xét
      </button>

      <!-- Feedback Area -->
      <div id="evaluator-feedback-area" class="hidden pt-4 border-t border-gray-700 space-y-4">
        <!-- Injected via learning.js -->
      </div>
    </div>
  </div>
</div>

<!-- 3. ITEM CRUD MODAL (ADD / EDIT) -->
<div id="learning-item-crud-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
  <div class="bg-gray-800 rounded-2xl border border-gray-700 w-full max-w-lg max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
    <div class="px-6 py-4 bg-gray-850 border-b border-gray-700 flex items-center justify-between">
      <h3 class="font-bold text-white text-base" id="crud-modal-title">Thêm nội dung mới</h3>
      <button data-action="learning.closeModal" data-action-args='["learning-item-crud-modal"]' class="text-gray-400 hover:text-white text-xl leading-none">&times;</button>
    </div>

    <div class="p-6 space-y-3.5 overflow-y-auto flex-1 text-xs">
      <input type="hidden" id="crud-item-id" />
      <div>
        <label class="block text-gray-400 mb-1 font-semibold">Chủ đề / Stack</label>
        <select id="crud-learning-id" class="w-full px-3 py-2 bg-gray-900 rounded-xl border border-gray-700 text-white focus:outline-none"></select>
      </div>

      <div>
        <label class="block text-gray-400 mb-1 font-semibold">Tiêu đề (Từ vựng / Tiêu đề câu hỏi)</label>
        <input id="crud-title" type="text" placeholder="Tiêu đề..." class="w-full px-3 py-2 bg-gray-900 rounded-xl border border-gray-700 text-white focus:outline-none" />
      </div>

      <div>
        <label class="block text-gray-400 mb-1 font-semibold">Nghĩa tiếng Việt / Câu trả lời nhanh</label>
        <input id="crud-meaning" type="text" placeholder="Nghĩa hoặc Quick answer..." class="w-full px-3 py-2 bg-gray-900 rounded-xl border border-gray-700 text-white focus:outline-none" />
      </div>

      <div>
        <label class="block text-gray-400 mb-1 font-semibold">Phiên âm / Cấp độ</label>
        <input id="crud-pronunciation" type="text" placeholder="/.../ hoặc Level" class="w-full px-3 py-2 bg-gray-900 rounded-xl border border-gray-700 text-white focus:outline-none" />
      </div>

      <div>
        <label class="block text-gray-400 mb-1 font-semibold">Ví dụ / Đề bài chi tiết</label>
        <textarea id="crud-prompt" rows="3" placeholder="Ví dụ hoặc prompt..." class="w-full px-3 py-2 bg-gray-900 rounded-xl border border-gray-700 text-white focus:outline-none resize-none"></textarea>
      </div>

      <div>
        <label class="block text-gray-400 mb-1 font-semibold">Bản dịch ví dụ / Ghi chú</label>
        <input id="crud-note" type="text" placeholder="Dịch câu ví dụ..." class="w-full px-3 py-2 bg-gray-900 rounded-xl border border-gray-700 text-white focus:outline-none" />
      </div>

      <button data-action="learning.saveCrudItem" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-bold transition shadow">
        Lưu Nội Dung
      </button>
    </div>
  </div>
</div>
