<div id="page-chat" class="flex flex-col h-full min-h-0 overflow-hidden">
  <!-- Model selector (admin only — hidden for regular users via JS) -->
  <div id="model-bar" class="flex items-center justify-center py-2 px-3 border-b border-gray-700 bg-gray-900 relative shrink-0">
    <div class="relative max-w-full">
      <button data-action="modelSelector.toggle" id="model-btn" class="flex items-center gap-2 px-3 sm:px-4 py-1.5 sm:py-2 rounded-xl hover:bg-gray-800 transition font-semibold text-xs sm:text-sm text-white max-w-full truncate active:scale-95">
        <span id="model-icon">🌟</span>
        <span id="model-display" class="truncate">Gemini 2.5 Flash</span>
        <svg class="w-3.5 h-3.5 text-gray-400 mt-0.5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
        </svg>
      </button>

      <!-- Dropdown -->
      <div id="model-dropdown" class="hidden absolute top-full left-1/2 -translate-x-1/2 mt-2 bg-gray-800 rounded-xl shadow-2xl border border-gray-700 w-72 sm:w-80 max-w-[calc(100vw-2rem)] z-50 overflow-hidden">
        <div id="model-dropdown-options" class="p-1.5 space-y-0.5 max-h-80 overflow-y-auto overscroll-contain"></div>
      </div>
    </div>
  </div>

  <!-- Messages Window -->
  <div id="chat-window" class="flex-1 overflow-y-auto py-4 sm:py-6 px-3 sm:px-6 space-y-4 sm:space-y-6 touch-scroll">
    <div id="chat-empty" class="flex flex-col items-center justify-center h-full text-center px-4">
      <div class="w-14 h-14 sm:w-16 sm:h-16 rounded-full overflow-hidden mb-3 sm:mb-4 shadow-lg ring-2 ring-indigo-500/20" style="width: 56px; height: 56px; min-width: 56px; min-height: 56px;">
        <img src="/images/dan.png" alt="Đần" width="56" height="56" class="w-full h-full object-cover rounded-full" style="width: 56px; height: 56px; aspect-ratio: 1/1;" loading="eager" decoding="sync" />
      </div>
      <h2 class="text-lg sm:text-xl font-semibold text-gray-200 mb-1.5 sm:mb-2">Xin chào! Tôi là Đần</h2>
      <p class="text-gray-400 text-xs sm:text-sm max-w-xs leading-relaxed">AI được tạo bởi Hoàng Phát, kết hợp nhiều model AI. Hỏi tôi bất cứ điều gì!</p>
    </div>
  </div>

  <!-- Input area -->
  <div class="shrink-0 border-t border-gray-700/80 bg-gray-900 px-3 sm:px-4 py-2.5 sm:py-4 safe-area-pb">
    <div class="max-w-3xl mx-auto">
      <div class="flex items-end gap-2 sm:gap-3 bg-gray-800 rounded-2xl border border-gray-700 focus-within:border-indigo-500 px-3 sm:px-4 py-2.5 sm:py-3 transition shadow-lg">
        <textarea id="chat-input" rows="1" placeholder="Hỏi Đần điều gì đó… (Shift+Enter để xuống dòng)" class="flex-1 bg-transparent resize-none text-base sm:text-sm focus:outline-none text-white placeholder-gray-500 max-h-36 sm:max-h-40 leading-relaxed" data-input-action="chat.resizeInput" data-keydown-action="chat.sendOnEnter" data-action-key="Enter" data-pass-event="true" data-pass-element="true"></textarea>
        <button data-action="chat.send" id="chat-send" class="shrink-0 w-9 h-9 sm:w-8 sm:h-8 flex items-center justify-center bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white rounded-xl sm:rounded-lg transition disabled:opacity-40 disabled:cursor-not-allowed active:scale-95 shadow" aria-label="Gửi tin nhắn">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="22" y1="2" x2="11" y2="13" />
            <polygon points="22 2 15 22 11 13 2 9 22 2" />
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>
