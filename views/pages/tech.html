<div id="page-tech" class="flex-1 overflow-y-auto touch-scroll">
  <div class="max-w-7xl mx-auto px-3.5 sm:px-6 py-4 sm:py-8 space-y-4 sm:space-y-6 safe-area-pb">
    <!-- Header -->
    <div class="flex items-center justify-between flex-wrap gap-4">
      <div>
        <h1 class="text-2xl font-bold flex items-center gap-2.5">
          <span>💻</span>
          <span>Tech Learning & Interview Bank</span>
        </h1>
        <p class="text-xs text-gray-400 mt-1">100 câu hỏi phỏng vấn & làm việc thực tế cho 6 Tech Stacks (PHP, Next.js, Python, React.js, JavaScript, Node.js)</p>
      </div>
      <div class="flex items-center gap-2 overflow-x-auto pb-1 sm:pb-0 touch-scroll shrink-0 max-w-full flex-nowrap sm:flex-wrap">
        <button data-action="tech.openAiGeneratorModal" class="shrink-0 px-3.5 py-2 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white rounded-xl text-xs font-bold shadow-lg shadow-indigo-500/20 transition flex items-center gap-1.5">
          <span>✨</span> AI Tạo Câu Hỏi
        </button>
        <button data-action="tech.openCreateModal" id="tech-btn-add" class="shrink-0 px-3 py-2 bg-gray-800 hover:bg-gray-700 border border-gray-700 text-gray-200 rounded-xl text-xs font-semibold transition flex items-center gap-1.5">
          <span>➕</span> Thêm câu hỏi
        </button>
        <button data-action="tech.openImportModal" id="tech-btn-import" class="shrink-0 px-3 py-2 bg-gray-800 hover:bg-gray-700 border border-gray-700 text-gray-200 rounded-xl text-xs font-semibold transition flex items-center gap-1.5">
          <span>📥</span> Import Excel
        </button>
        <button data-action="tech.exportExcel" class="shrink-0 px-3 py-2 bg-gray-800 hover:bg-gray-700 border border-gray-700 text-gray-200 rounded-xl text-xs font-semibold transition flex items-center gap-1.5">
          <span>📦</span> Export
        </button>
        <button data-action="tech.load" class="shrink-0 text-sm text-indigo-400 hover:text-indigo-300 ml-2">↻ Refresh</button>
      </div>
    </div>

    <!-- 6 Tech Stack Selector Pills / Cards -->
    <div id="tech-stacks-container" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3"></div>

    <!-- Filter & Search Toolbar -->
    <div class="bg-gray-800/80 backdrop-blur rounded-2xl p-4 border border-gray-700/80 shadow-md flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3 flex-wrap flex-1 min-w-[280px]">
        <!-- Search -->
        <div class="relative flex-1 min-w-[200px]">
          <input id="tech-search-input" type="text" placeholder="Tìm theo tiêu đề, câu hỏi, tag..." class="w-full pl-9 pr-4 py-2 bg-gray-900/90 rounded-xl border border-gray-700 focus:border-indigo-500 focus:outline-none text-xs text-white placeholder-gray-500" data-input-action="tech.onSearchInput" data-pass-value="true" />
          <svg class="w-4 h-4 text-gray-500 absolute left-3 top-2.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
        </div>

        <!-- Level Filter -->
        <select id="tech-level-filter" data-change-action="tech.onFilterChange" class="px-3 py-2 bg-gray-900 rounded-xl border border-gray-700 text-xs text-gray-300 focus:outline-none focus:border-indigo-500">
          <option value="all">Tất cả Level</option>
          <option value="fresher">🌱 Fresher</option>
          <option value="junior">⚡ Junior</option>
          <option value="mid">🚀 Mid-Level</option>
          <option value="senior">👑 Senior</option>
        </select>

        <!-- Status Filter -->
        <select id="tech-status-filter" data-change-action="tech.onFilterChange" class="px-3 py-2 bg-gray-900 rounded-xl border border-gray-700 text-xs text-gray-300 focus:outline-none focus:border-indigo-500">
          <option value="all">Tất cả trạng thái</option>
          <option value="unlearned">⚪ Chưa học</option>
          <option value="learning">🟡 Đang luyện</option>
          <option value="review_needed">🟠 Cần ôn lại</option>
          <option value="mastered">🟢 Đã thành thạo</option>
        </select>

        <!-- Bookmark toggle -->
        <label class="flex items-center gap-1.5 text-xs text-gray-300 cursor-pointer bg-gray-900 px-3 py-2 rounded-xl border border-gray-700 hover:border-gray-600 transition">
          <input id="tech-bookmark-filter" type="checkbox" data-change-action="tech.onFilterChange" class="accent-amber-400" />
          <span>⭐ Đã Bookmark</span>
        </label>
      </div>

      <!-- View Mode Toggle -->
      <div class="flex items-center gap-1 bg-gray-900 p-1 rounded-xl border border-gray-700">
        <button id="tech-view-split" data-action="tech.setViewMode" data-action-args='["split"]' class="px-3 py-1.5 rounded-lg text-xs font-semibold transition bg-indigo-600 text-white">
          📋 Danh sách & Chi tiết
        </button>
        <button id="tech-view-flashcard" data-action="tech.setViewMode" data-action-args='["flashcard"]' class="px-3 py-1.5 rounded-lg text-xs font-semibold text-gray-400 hover:text-white transition">
          🎴 Flashcard Ôn tập
        </button>
      </div>
    </div>

    <!-- Main Workspace (Split View vs Flashcard View) -->
    <div id="tech-workspace-container"></div>
  </div>
</div>


<!-- include: partials/modals/tech.html -->
</div>
