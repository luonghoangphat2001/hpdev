<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đần AI — Dashboard</title>
  <script src="/libs/tailwindcss.js?v={{VERSION}}"></script>
  <link rel="stylesheet" href="/css/style.css?v={{VERSION}}" />
</head>

<body class="bg-gray-900 min-h-screen flex items-center justify-center px-4 py-8 safe-area-pb">
  <div class="w-full max-w-sm">

    <!-- Avatar + branding -->
    <div class="text-center mb-6 sm:mb-8">
      <div class="w-16 h-16 sm:w-20 sm:h-20 rounded-full overflow-hidden mx-auto mb-3 sm:mb-4 ring-4 ring-indigo-500/40 shadow-xl" style="width: 64px; height: 64px; min-width: 64px; min-height: 64px;">
        <img src="/images/dan.png" alt="Đần" width="64" height="64" class="w-full h-full object-cover rounded-full" style="width: 64px; height: 64px; aspect-ratio: 1/1;" loading="eager" decoding="sync" />
      </div>
      <div class="flex items-center justify-center gap-2">
        <h1 class="text-2xl sm:text-3xl font-bold text-white">Xin chào! Tôi là Đần</h1>
        <span class="text-[10px] font-mono px-2 py-0.5 rounded-full bg-indigo-900/60 border border-indigo-700/60 text-indigo-300 font-semibold">v{{VERSION}}</span>
      </div>
      <p class="text-gray-400 text-xs sm:text-sm mt-2 leading-relaxed max-w-xs mx-auto">
        Một AI agent được tạo bởi <span class="text-indigo-400 font-medium">Phát</span>,
        tổng hợp nhiều model —
        <span class="text-yellow-400">Gemini</span>,
        <span class="text-purple-400">Claude</span>,
        <span class="text-green-400">GPT</span> —
        để tương tác cá nhân.
      </p>
    </div>

    <!-- Login card -->
    <div class="bg-gray-800 rounded-2xl shadow-2xl p-6 sm:p-8 border border-gray-700/60">
      <p class="text-gray-400 text-xs sm:text-sm text-center mb-4 sm:mb-5">Đăng nhập để tiếp tục</p>

      <form method="POST" action="/login" class="space-y-3.5 sm:space-y-4">
        <input type="text" name="username" value="admin" placeholder="Username" autofocus autocomplete="username" class="w-full px-4 py-3 rounded-xl bg-gray-900 text-white placeholder-gray-500 border border-gray-700 focus:border-indigo-500 focus:outline-none text-base sm:text-sm" />
        <input type="password" name="password" value="Luonghoangphat12001@" placeholder="Password" autocomplete="current-password" class="w-full px-4 py-3 rounded-xl bg-gray-900 text-white placeholder-gray-500 border border-gray-700 focus:border-indigo-500 focus:outline-none text-base sm:text-sm" />
        <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-semibold rounded-xl transition shadow-lg shadow-indigo-600/30 active:scale-95">
          Đăng nhập
        </button>
      </form>

      <script>
        if (new URLSearchParams(location.search).get("error")) {
          const el = document.createElement("p");
          el.className = "text-red-400 text-sm text-center mt-4";
          el.textContent = "Sai username hoặc password. Thử lại.";
          document.querySelector("form").after(el);
        }
      </script>
    </div>
  </div>
</body>

</html>
