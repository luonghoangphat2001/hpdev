<div id="page-study" class="flex-1 overflow-y-auto touch-scroll">
  <div class="max-w-5xl mx-auto px-3.5 sm:px-6 py-4 sm:py-8 space-y-4 sm:space-y-6 safe-area-pb">
    <div class="flex items-center justify-between">
      <h1 class="text-2xl font-bold">📅 Schedule</h1>
      <button data-action="study.load" class="text-sm text-indigo-400 hover:text-indigo-300">↻ Refresh</button>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <div class="bg-gray-800 rounded-xl p-6 space-y-4">
        <h2 id="study-form-title" class="font-semibold text-gray-300">Thêm lịch trình</h2>
        <div>
          <label class="block text-xs text-gray-400 mb-1">User ID</label>
          <input id="study-user-id" type="text" class="w-full px-3 py-2.5 bg-gray-700 rounded-lg border border-gray-600 focus:border-indigo-500 focus:outline-none text-sm" />
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1">Username</label>
          <input id="study-username" type="text" class="w-full px-3 py-2.5 bg-gray-700 rounded-lg border border-gray-600 focus:border-indigo-500 focus:outline-none text-sm" />
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs text-gray-400 mb-1">Platform</label>
            <select id="study-platform" class="w-full px-3 py-2.5 bg-gray-700 rounded-lg border border-gray-600 focus:border-indigo-500 focus:outline-none text-sm">
              <option value="discord">discord</option>
              <option value="telegram">telegram</option>
            </select>
          </div>
          <div>
            <label class="block text-xs text-gray-400 mb-1">Repeat</label>
            <select id="study-repeat" class="w-full px-3 py-2.5 bg-gray-700 rounded-lg border border-gray-600 focus:border-indigo-500 focus:outline-none text-sm">
              <option value="none">none</option>
              <option value="daily">daily</option>
              <option value="weekly">weekly</option>
            </select>
          </div>
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1">Channel ID</label>
          <input id="study-channel-id" type="text" class="w-full px-3 py-2.5 bg-gray-700 rounded-lg border border-gray-600 focus:border-indigo-500 focus:outline-none text-sm" />
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1">Nội dung nhắc nhở / Title</label>
          <input id="study-title" type="text" class="w-full px-3 py-2.5 bg-gray-700 rounded-lg border border-gray-600 focus:border-indigo-500 focus:outline-none text-sm" />
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1">Thời gian nhắc (YYYY-MM-DD HH:MM:SS)</label>
          <input id="study-remind-at" type="datetime-local" class="w-full px-3 py-2.5 bg-gray-700 rounded-lg border border-gray-600 focus:border-indigo-500 focus:outline-none text-sm" />
        </div>
        <div class="flex gap-2 pt-2">
          <button data-action="study.save" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 rounded-lg text-sm font-semibold transition">Save</button>
          <button id="study-btn-cancel" data-action="study.clearForm" class="px-4 py-2.5 bg-gray-700 hover:bg-gray-600 rounded-lg text-sm transition hidden">Hủy</button>
        </div>
        <p id="study-msg" class="text-sm hidden"></p>
      </div>

      <div class="lg:col-span-2 space-y-6">
        <div class="bg-gray-800 rounded-xl overflow-hidden">
          <div class="px-4 py-3 border-b border-gray-700">
            <h2 class="font-semibold text-gray-300">Lịch trình sắp tới (7 ngày)</h2>
          </div>
          <div id="study-timeline" class="p-4 space-y-3"></div>
        </div>

        <div class="bg-gray-800 rounded-xl overflow-hidden">
          <div class="px-4 py-3 border-b border-gray-700">
            <h2 class="font-semibold text-gray-300">Tất cả lịch trình</h2>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full text-left text-sm text-gray-300">
              <thead class="bg-gray-750 text-gray-400 uppercase text-xs">
                <tr>
                  <th class="px-4 py-3">Title</th>
                  <th class="px-4 py-3">Platform</th>
                  <th class="px-4 py-3">Remind At</th>
                  <th class="px-4 py-3">Repeat</th>
                  <th class="px-4 py-3">Actions</th>
                </tr>
              </thead>
              <tbody id="study-table-body" class="divide-y divide-gray-700"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
