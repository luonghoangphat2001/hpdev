<div id="page-users" class="flex-1 overflow-y-auto touch-scroll">
  <div class="max-w-3xl mx-auto px-3.5 sm:px-6 py-4 sm:py-8 space-y-4 sm:space-y-6 safe-area-pb">
    <div class="flex items-center justify-between pb-3 sm:pb-4 border-b border-gray-800 gap-2">
      <div>
        <h1 class="text-xl sm:text-2xl font-bold text-gray-100 flex items-center gap-2">
          <span>👥</span> Quản lý Người dùng
        </h1>
        <p class="text-[11px] sm:text-xs text-gray-400 mt-0.5">Quản lý danh sách tài khoản, phân quyền và bảo mật</p>
      </div>
      <button data-action="users.load" class="px-3 py-1.5 bg-gray-800 hover:bg-gray-700 active:bg-gray-600 text-gray-300 rounded-xl text-xs font-medium border border-gray-700 transition flex items-center gap-1.5 shrink-0 active:scale-95">
        <span>↻</span> Làm mới
      </button>
    </div>

    <!-- Section 1: Đổi mật khẩu của tôi -->
    <div class="bg-gray-800/90 rounded-2xl p-4 sm:p-6 border border-gray-700/60 shadow-lg">
      <div class="flex items-center justify-between mb-2 sm:mb-3">
        <h2 class="font-semibold text-sm sm:text-base text-gray-200 flex items-center gap-2">
          <span>🔐</span> Đổi mật khẩu tài khoản
        </h2>
        <span id="current-user-badge" class="text-xs font-medium px-2.5 py-0.5 rounded-lg bg-indigo-900/60 text-indigo-300 border border-indigo-700/50"></span>
      </div>
      <p class="text-xs text-gray-400 mb-3 sm:mb-4">Cập nhật mật khẩu đăng nhập cho tài khoản đang hoạt động.</p>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-3">
        <div>
          <label class="block text-xs text-gray-400 mb-1">Mật khẩu mới</label>
          <input type="password" id="my-new-password" placeholder="Tối thiểu 6 ký tự" class="w-full px-3.5 py-2.5 bg-gray-900 rounded-xl border border-gray-700 focus:border-indigo-500 focus:outline-none text-base sm:text-sm text-white" />
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1">Xác nhận mật khẩu mới</label>
          <input type="password" id="my-confirm-password" placeholder="Nhập lại mật khẩu mới" class="w-full px-3.5 py-2.5 bg-gray-900 rounded-xl border border-gray-700 focus:border-indigo-500 focus:outline-none text-base sm:text-sm text-white" />
        </div>
      </div>
      <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3 pt-1">
        <button data-action="users.changeMyPassword" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 rounded-xl text-xs sm:text-sm font-semibold transition shadow-md active:scale-95 text-center">
          Cập nhật mật khẩu
        </button>
        <span id="my-pw-msg" class="text-xs sm:text-sm hidden"></span>
      </div>
    </div>

    <!-- Section 2: Thêm người dùng mới -->
    <div class="bg-gray-800/90 rounded-2xl p-4 sm:p-6 border border-gray-700/60 shadow-lg">
      <h2 class="font-semibold text-sm sm:text-base text-gray-200 mb-1 flex items-center gap-2">
        <span>➕</span> Thêm người dùng mới
      </h2>
      <p class="text-xs text-gray-400 mb-3 sm:mb-4">Tạo tài khoản truy cập mới với vai trò User hoặc Admin.</p>
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-4">
        <div>
          <label class="block text-xs text-gray-400 mb-1">Tên đăng nhập</label>
          <input type="text" id="new-username" placeholder="Ví dụ: john_doe" class="w-full px-3.5 py-2.5 bg-gray-900 rounded-xl border border-gray-700 focus:border-indigo-500 focus:outline-none text-base sm:text-sm text-white" />
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1">Mật khẩu ban đầu</label>
          <input type="password" id="new-user-password" placeholder="Tối thiểu 6 ký tự" class="w-full px-3.5 py-2.5 bg-gray-900 rounded-xl border border-gray-700 focus:border-indigo-500 focus:outline-none text-base sm:text-sm text-white" />
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1">Vai trò</label>
          <select id="new-user-role" class="w-full px-3.5 py-2.5 bg-gray-900 rounded-xl border border-gray-700 focus:border-indigo-500 focus:outline-none text-base sm:text-sm text-white">
            <option value="user">User — Chỉ dùng Chat & Học</option>
            <option value="admin">Admin — Toàn quyền quản trị</option>
          </select>
        </div>
      </div>
      <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3">
        <button data-action="users.add" class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 rounded-xl text-xs sm:text-sm font-semibold transition shadow-md active:scale-95 text-center">
          ➕ Thêm người dùng
        </button>
        <span id="add-user-msg" class="text-xs sm:text-sm hidden"></span>
      </div>
    </div>

    <!-- Section 3: Danh sách người dùng -->
    <div class="bg-gray-800/90 rounded-2xl p-4 sm:p-6 border border-gray-700/60 shadow-lg">
      <div class="flex items-center justify-between mb-4">
        <div class="flex items-center gap-2">
          <h2 class="font-semibold text-sm sm:text-base text-gray-200">Danh sách tài khoản</h2>
          <span id="user-count-badge" class="text-xs bg-gray-700 text-gray-300 px-2 py-0.5 rounded-full font-medium">0</span>
        </div>
      </div>
      <div id="user-list" class="space-y-3"></div>
    </div>
  </div>

  <!-- Modal: Đổi mật khẩu cho user -->
  <div id="edit-user-modal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-3 sm:p-4">
    <div class="bg-gray-800 border border-gray-700 rounded-2xl max-w-md w-full p-4 sm:p-6 shadow-2xl space-y-4">
      <div class="flex items-center justify-between pb-3 border-b border-gray-700">
        <h3 class="font-semibold text-sm sm:text-base text-gray-100 flex items-center gap-2 truncate">
          <span>🔑</span> Đổi mật khẩu cho <span id="modal-target-username" class="text-indigo-400 truncate"></span>
        </h3>
        <button data-action="users.closeModal" class="w-8 h-8 rounded-lg bg-gray-700 hover:bg-gray-600 text-gray-300 flex items-center justify-center text-lg leading-none shrink-0">&times;</button>
      </div>
      <div>
        <label class="block text-xs text-gray-400 mb-1">Mật khẩu mới (tối thiểu 6 ký tự)</label>
        <input type="password" id="modal-new-password" placeholder="Nhập mật khẩu mới" class="w-full px-3.5 py-2.5 bg-gray-900 rounded-xl border border-gray-700 focus:border-indigo-500 focus:outline-none text-base sm:text-sm text-white" />
      </div>
      <div id="modal-pw-msg" class="text-xs sm:text-sm hidden"></div>
      <div class="flex justify-end gap-2 pt-2">
        <button data-action="users.closeModal" class="px-4 py-2 bg-gray-700 hover:bg-gray-600 active:bg-gray-500 text-gray-300 rounded-xl text-xs sm:text-sm transition">Hủy</button>
        <button data-action="users.saveUserPassword" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-semibold rounded-xl text-xs sm:text-sm transition">Lưu mật khẩu</button>
      </div>
    </div>
  </div>
</div>
