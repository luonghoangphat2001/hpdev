<div id="page-vocabulary" class="flex-1 overflow-y-auto touch-scroll">
  <div class="max-w-6xl mx-auto px-3.5 sm:px-6 py-4 sm:py-8 space-y-4 sm:space-y-6 safe-area-pb">
    <div class="flex items-center justify-between">
      <h1 class="text-2xl font-bold">📚 Vocabulary</h1>
      <div class="flex items-center gap-2 overflow-x-auto pb-1 sm:pb-0 touch-scroll shrink-0 max-w-full flex-nowrap sm:flex-wrap">
        <button data-action="vocabulary.exportCurrentTopic" class="shrink-0 px-3 py-1.5 bg-gray-700 hover:bg-gray-600 border border-gray-600 text-gray-200 rounded-lg text-xs font-semibold transition flex items-center gap-1.5">
          📥 Export Topic hiện tại
        </button>
        <button data-action="vocabulary.exportAll" class="shrink-0 px-3 py-1.5 bg-gray-700 hover:bg-gray-600 border border-gray-600 text-gray-200 rounded-lg text-xs font-semibold transition flex items-center gap-1.5">
          📦 Export Tất cả Topic
        </button>
        <button data-action="vocabulary.fillPronunciations" class="shrink-0 px-3 py-1.5 bg-indigo-600/30 border border-indigo-500/50 hover:bg-indigo-600/50 text-indigo-300 rounded-lg text-xs font-semibold transition flex items-center gap-1.5">
          🇺🇸 Tự động lấy phiên âm Mỹ cho từ cũ
        </button>
        <button data-action="vocabulary.load" class="shrink-0 text-sm text-indigo-400 hover:text-indigo-300">↻ Refresh</button>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <div class="bg-gray-800 rounded-xl p-6 space-y-4">
        <h2 class="font-semibold text-gray-300">Thông báo hằng ngày</h2>
        <label class="flex items-center gap-2 text-sm text-gray-300">
          <input id="vocab-enabled" type="checkbox" class="accent-indigo-500" />
          Bật gửi từ vựng
        </label>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs text-gray-400 mb-1">Giờ gửi</label>
            <input id="vocab-daily-time" type="time" class="w-full px-3 py-2.5 bg-gray-700 rounded-lg border border-gray-600 focus:border-indigo-500 focus:outline-none text-sm" />
          </div>
          <div>
            <label class="block text-xs text-gray-400 mb-1">Từ/ngày</label>
            <input id="vocab-words-per-day" type="number" min="1" max="50" class="w-full px-3 py-2.5 bg-gray-700 rounded-lg border border-gray-600 focus:border-indigo-500 focus:outline-none text-sm" />
          </div>
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1">Discord Channel ID</label>
          <input id="vocab-channel-id" type="text" class="w-full px-3 py-2.5 bg-gray-700 rounded-lg border border-gray-600 focus:border-indigo-500 focus:outline-none text-sm" />
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs text-gray-400 mb-1">Mode</label>
            <select id="vocab-topic-mode" class="w-full px-3 py-2.5 bg-gray-700 rounded-lg border border-gray-600 focus:border-indigo-500 focus:outline-none text-sm">
              <option value="sequential">sequential</option>
              <option value="fixed">fixed</option>
            </select>
          </div>
          <div>
            <label class="block text-xs text-gray-400 mb-1">Topic hiện tại</label>
            <input id="vocab-current-topic" type="number" min="1" max="50" class="w-full px-3 py-2.5 bg-gray-700 rounded-lg border border-gray-600 focus:border-indigo-500 focus:outline-none text-sm" />
          </div>
        </div>
        <p class="text-xs text-gray-500">Lần gửi gần nhất: <span id="vocab-last-sent" class="text-gray-300"></span></p>
        <button data-action="vocabulary.saveConfig" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 rounded-lg text-sm font-semibold transition">Save</button>
        <p id="vocab-msg" class="text-sm hidden"></p>
      </div>

      <div class="lg:col-span-2 bg-gray-800 rounded-xl p-6">
        <h2 class="font-semibold text-gray-300 mb-4">Chủ đề 1-50</h2>
        <div id="vocab-topic-list" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-3 max-h-[520px] overflow-y-auto pr-1"></div>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <div class="bg-gray-800 rounded-xl p-6 space-y-4">
        <h2 class="font-semibold text-gray-300">Thêm từ</h2>
        <div>
          <label class="block text-xs text-gray-400 mb-1">Topic</label>
          <input id="vocab-word-topic" type="number" min="1" max="50" value="1" class="w-full px-3 py-2.5 bg-gray-700 rounded-lg border border-gray-600 focus:border-indigo-500 focus:outline-none text-sm" />
        </div>
        <input id="vocab-word" type="text" placeholder="word" class="w-full px-3 py-2.5 bg-gray-700 rounded-lg border border-gray-600 focus:border-indigo-500 focus:outline-none text-sm" />
        <textarea id="vocab-meaning" rows="2" placeholder="meaning" class="w-full px-3 py-2.5 bg-gray-700 rounded-lg border border-gray-600 focus:border-indigo-500 focus:outline-none text-sm resize-none"></textarea>
        <input id="vocab-pronunciation" type="text" placeholder="pronunciation (phiên âm Mỹ /.../)" class="w-full px-3 py-2.5 bg-gray-700 rounded-lg border border-gray-600 focus:border-indigo-500 focus:outline-none text-sm" />
        <textarea id="vocab-example" rows="2" placeholder="example" class="w-full px-3 py-2.5 bg-gray-700 rounded-lg border border-gray-600 focus:border-indigo-500 focus:outline-none text-sm resize-none"></textarea>
        <input id="vocab-note" type="text" placeholder="note" class="w-full px-3 py-2.5 bg-gray-700 rounded-lg border border-gray-600 focus:border-indigo-500 focus:outline-none text-sm" />
        <button data-action="vocabulary.addWord" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 rounded-lg text-sm font-semibold transition">Add Word</button>

        <div class="pt-4 border-t border-gray-700">
          <h3 class="text-sm font-semibold text-gray-300 mb-2">Import</h3>
          <input id="vocab-import-file" type="file" accept=".xlsx,.xls" class="w-full text-xs text-gray-300 file:mr-4 file:rounded-lg file:border-0 file:bg-gray-700 file:px-4 file:py-2 file:text-gray-200 hover:file:bg-gray-600" />
          <p class="mt-2 text-xs leading-5 text-gray-500">
            File Excel cần đúng 6 cột theo thứ tự: STT, Chủ đề, Từ vựng, Nghĩa tiếng Việt, Câu thực tiễn EN, Câu thực tiễn VI.
          </p>
          <button data-action="vocabulary.importWords" class="mt-3 px-5 py-2.5 bg-gray-700 hover:bg-gray-600 rounded-lg text-sm font-semibold transition">Import</button>
        </div>
      </div>

      <div class="lg:col-span-2 space-y-6">
        <div class="bg-gray-800 rounded-xl overflow-hidden">
          <div class="px-4 py-3 border-b border-gray-700 flex items-center justify-between">
            <h2 class="font-semibold text-gray-300">Danh sách từ</h2>
            <span class="text-xs text-gray-500">Theo topic đang chọn</span>
          </div>
          <div id="vocab-word-list" class="divide-y divide-gray-700"></div>
        </div>

        <div class="bg-gray-800 rounded-xl overflow-hidden">
          <div class="px-4 py-3 border-b border-gray-700">
            <h2 class="font-semibold text-gray-300">Lịch sử gửi</h2>
          </div>
          <div id="vocab-history" class="divide-y divide-gray-700"></div>
        </div>
      </div>
    </div>
  </div>
</div>
