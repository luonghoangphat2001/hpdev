<div id="page-logs" class="flex-1 overflow-y-auto touch-scroll">
  <div class="max-w-5xl mx-auto px-3.5 sm:px-6 py-4 sm:py-8 space-y-4 safe-area-pb">
    <div class="flex items-center justify-between pb-3 border-b border-gray-800">
      <h1 class="text-xl sm:text-2xl font-bold flex items-center gap-2 text-white">
        <span>📋</span> Logs Hệ thống
      </h1>
      <button data-action="logs.load" class="px-3 py-1.5 bg-gray-800 hover:bg-gray-700 active:bg-gray-600 text-gray-300 rounded-xl text-xs font-medium border border-gray-700 transition flex items-center gap-1.5 active:scale-95">
        <span>↻</span> Làm mới
      </button>
    </div>
    <div class="flex gap-2 sm:gap-3 flex-wrap" id="log-file-list"></div>
    <div class="bg-gray-900 rounded-2xl border border-gray-700/60 overflow-hidden shadow-xl">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between px-3.5 sm:px-4 py-2.5 bg-gray-800/80 border-b border-gray-700/80 gap-2">
        <span id="log-filename" class="text-xs text-gray-300 font-mono truncate">Chọn file bên trên để xem</span>
        <div class="flex items-center gap-2.5 self-end sm:self-auto">
          <label class="flex items-center gap-1.5 text-xs text-gray-400 cursor-pointer select-none">
            <input type="checkbox" id="log-autoscroll" checked class="accent-indigo-500 rounded"> Auto-scroll
          </label>
          <input type="text" id="log-filter" placeholder="Lọc log..." data-input-action="logs.filter" class="px-2.5 py-1 bg-gray-900 rounded-lg border border-gray-700 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500 w-32 sm:w-40">
        </div>
      </div>
      <pre id="log-content" class="text-xs text-gray-300 p-3 sm:p-4 overflow-auto h-[55vh] sm:h-[60vh] whitespace-pre-wrap break-all font-mono touch-scroll">Chưa có log nào được chọn.</pre>
    </div>
  </div>
</div>
