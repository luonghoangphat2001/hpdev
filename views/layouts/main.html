<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{PAGE_TITLE}} — Đần AI</title>
  <script src="/libs/tailwindcss.js?v={{VERSION}}"></script>
  <link rel="stylesheet" href="/css/style.css?v={{VERSION}}" />
</head>

<body class="bg-gray-900 text-white h-screen flex overflow-hidden">

  <!-- Global Progress Bar & Loading Indicator (Pure Tailwind CSS) -->
  <div id="global-progress-bar" class="fixed top-0 left-0 h-[3px] w-0 z-[99999] pointer-events-none opacity-0 transition-all duration-300 ease-out bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 shadow-[0_0_10px_rgba(99,102,241,0.8)]"></div>
  <div id="global-loading-badge" class="fixed bottom-5 right-5 z-[9999] hidden items-center gap-2 px-3.5 py-2 rounded-full bg-gray-800/95 border border-indigo-500/40 text-indigo-200 text-xs font-semibold shadow-2xl backdrop-blur-md pointer-events-none transition-all transform duration-200">
    <span class="inline-block w-3.5 h-3.5 border-2 border-indigo-400/30 border-t-indigo-400 rounded-full animate-spin"></span>
    <span>Đang tải...</span>
  </div>

  <!-- Backdrop Overlay for Mobile Sidebar -->
  <div id="sidebar-mobile-backdrop" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-40 md:hidden hidden transition-opacity duration-200" data-action="sidebar.closeMobile"></div>

  <!-- Sidebar Component -->
  <!-- include: partials/sidebar.html -->

  <!-- Main Container -->
  <main class="flex-1 flex flex-col min-w-0 overflow-hidden relative">
    <!-- Mobile Top Navigation Header -->
    <header id="mobile-top-bar" class="md:hidden flex items-center justify-between px-3.5 py-2.5 bg-gray-800/95 border-b border-gray-700/80 backdrop-blur-md shrink-0 z-30">
      <button id="mobile-sidebar-toggle" data-action="sidebar.openMobile" type="button" class="w-9 h-9 rounded-lg bg-gray-700/80 hover:bg-gray-700 active:bg-indigo-600 text-gray-200 flex items-center justify-center transition active:scale-95" aria-label="Mở menu điều hướng">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>

      <div class="flex items-center gap-2">
        <div class="w-6 h-6 rounded-full overflow-hidden shrink-0">
          <img src="/images/dan.png" alt="Đần" width="24" height="24" class="w-full h-full object-cover rounded-full" />
        </div>
        <span class="font-bold text-white text-sm">Đần AI</span>
        <span class="text-[10px] font-mono px-1.5 py-0.5 rounded bg-gray-700/80 text-gray-300 font-semibold">v{{VERSION}}</span>
      </div>

      <div class="w-7 h-7 rounded-full bg-indigo-600 flex items-center justify-center text-xs font-bold text-white shrink-0 shadow-sm" id="mobile-user-avatar">
        {{USER_INITIAL}}
      </div>
    </header>

    {{BODY}}
  </main>

  <!-- Overlay for closing model dropdown -->
  <div id="overlay" class="fixed inset-0 z-40 hidden" data-action="modelSelector.close"></div>

  <!-- Shared Features Script -->
  <script type="module" src="/js/app/runtime.js?v={{VERSION}}"></script>

  <!-- Page Specific Script -->
  {{PAGE_SCRIPT}}
</body>

</html>
