name: Build & Deploy Dan Learning (learning.hpdev.name.vn)

on:
  push:
    branches:
      - learning
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build, Push DockerHub & Deploy Dan Learning
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/dan-learning:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/dan-learning:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install dependencies & Build Vue 3 App
        run: |
          npm ci --no-audit --no-fund
          npm run build
          printf '{"commit":"%s","builtAt":"%s"}\n' "${GITHUB_SHA}" "$(date -u +%FT%TZ)" > dist/version.json
          # Nén toàn bộ dist thành 1 file tar.gz duy nhất để upload siêu tốc trong 1 giây
          tar -czf dist.tar.gz -C dist .

      - name: Upload dist.tar.gz to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          source: "dist.tar.gz"
          target: "/home/hpdev/learning.hpdev.name.vn"

      - name: Extract & Clean on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          timeout: 60s
          command_timeout: 2m
          script: |
            TARGET_DIR="/home/hpdev/learning.hpdev.name.vn"
            mkdir -p "$TARGET_DIR"
            cd "$TARGET_DIR"
            if [ -f "dist.tar.gz" ]; then
              rm -rf "$TARGET_DIR/assets" "$TARGET_DIR/images"
              tar -xzf dist.tar.gz -C "$TARGET_DIR"
              rm -f dist.tar.gz
            fi
            grep -q "${{ github.sha }}" "$TARGET_DIR/version.json"
            # Dọn sạch các file rác nếu có
            find "$TARGET_DIR" -name '._*' -delete 2>/dev/null || true
            echo "==> [LEARNING] Deploy hoàn tất siêu tốc lúc $(date)!"

      - name: Verify production release
        run: |
          curl -fsS --retry 5 --retry-delay 3 https://learning.hpdev.name.vn/version.json | grep -q "${GITHUB_SHA}"
          curl -fsS --retry 5 --retry-delay 3 https://learning.hpdev.name.vn/ >/dev/null
