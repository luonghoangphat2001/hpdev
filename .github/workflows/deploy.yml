name: Deploy Dan API via Docker CI/CD (api.hpdev.name.vn)

on:
  push:
    branches:
      - api
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Containerized Backend via Docker
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH & Docker
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          timeout: 60s
          command_timeout: 10m
          script: |
            REPO_URL="https://github.com/${{ github.repository }}.git"
            GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}"
            B64_TOKEN=$(echo -n "x-access-token:$GITHUB_TOKEN" | base64 | tr -d '\n' || echo "")

            echo "==> Fetching latest changes for branch api..."
            cd /home/hpdev/api.hpdev.name.vn
            git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $B64_TOKEN"
            git fetch "$REPO_URL" api
            git reset --hard FETCH_HEAD
            git config --local --unset http.https://github.com/.extraheader || true

            echo "==> Triển khai Container Docker trên Server..."
            if command -v docker >/dev/null 2>&1; then
              if [ -f "docker-compose.yml" ]; then
                echo "==> Building & starting via Docker Compose..."
                docker compose up -d --build
                echo "==> Auto-seeding database inside Docker container..."
                docker exec dan_ai_api node scripts/seed-tech-learning.js || true
                docker exec dan_ai_api node scripts/seed-tech-fundamentals.js || true
              else
                echo "==> Building Docker image dan_ai_api..."
                docker build -t dan_ai_api .
                docker stop dan_ai_api 2>/dev/null || true
                docker rm dan_ai_api 2>/dev/null || true
                docker run -d --name dan_ai_api --restart unless-stopped -p 3000:3000 --env-file .env dan_ai_api
                docker exec dan_ai_api node scripts/seed-tech-learning.js || true
                docker exec dan_ai_api node scripts/seed-tech-fundamentals.js || true
              fi
            fi

            # Reload Passenger / PM2 if configured
            mkdir -p tmp && touch tmp/restart.txt
            pm2 reload bot 2>/dev/null || pm2 restart bot 2>/dev/null || true
            echo "==> Deploy Docker CI/CD thành công lúc $(date)!"
