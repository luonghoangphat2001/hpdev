name: Build & Deploy Dan Learning

on:
  push:
    branches:
      - learning
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build on GitHub & Prepare Static Dist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Vue 3 App
        run: |
          npm ci || npm install
          npm run build
          echo "==> Build tĩnh hoàn tất, sẵn sàng deploy file dist siêu nhẹ."
