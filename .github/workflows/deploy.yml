name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - ai
      - openclaw
  pull_request:
    branches:
      - main
      - ai
      - openclaw
  workflow_dispatch:

jobs:
  docker-package:
    name: Build & Package Docker Image
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image & package
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ env.DOCKERHUB_USERNAME != '' && github.event_name != 'pull_request' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME || 'hpdev' }}/openclaw:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME || 'hpdev' }}/openclaw:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Server
    needs: [docker-package]
    if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'ai' || github.ref_name == 'openclaw')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            set -e
            BRANCH="${{ github.ref_name }}"
            if [ "$BRANCH" = "main" ]; then
              cd /home/hpdev/public_html
              git pull origin main
              echo "Deploy completed at $(date)"
            elif [ "$BRANCH" = "ai" ]; then
              cd ~/ai.hpdev.name.vn
              git pull origin ai
              source ~/nodevenv/ai.hpdev.name.vn/19/bin/activate
              npm install
              mkdir -p tmp && touch tmp/restart.txt
              which pm2 || npm install -g pm2
              pm2 delete bot 2>/dev/null || true
              pm2 start bot.js --name bot
              pm2 save
            elif [ "$BRANCH" = "openclaw" ]; then
              cd ~/openclaw.hpdev.name.vn
              git pull --ff-only origin openclaw
              npm ci
              npm run migrate
              npx playwright install chromium 2>/dev/null || true
              mkdir -p tmp && touch tmp/restart.txt
              pm2 delete openclaw 2>/dev/null || true
              pm2 save 2>/dev/null || true
            fi
