name: Build & Deploy Dan Learning

on:
  push:
    branches:
      - learning
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Verify Dan Learning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies & Build
        run: |
          npm install --prefer-offline --no-audit --no-fund
          npm run build
          echo "==> Build tĩnh hoàn tất thành công!"
