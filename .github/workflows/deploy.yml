name: Deploy Dan API (api.hpdev.name.vn)

on:
  push:
    branches:
      - api
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Package on GitHub & Ultra-Fast Deploy API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Package API Files
        run: |
          # Nén toàn bộ mã nguồn API (loại trừ git/node_modules) thành 1 archive duy nhất
          tar --exclude='.git' --exclude='node_modules' --exclude='.github' -czf api.tar.gz .

      - name: Upload api.tar.gz to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          source: "api.tar.gz"
          target: "/home/hpdev/api.hpdev.name.vn"

      - name: Deploy & Seed on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          timeout: 60s
          command_timeout: 5m
          script: |
            TARGET_DIR="/home/hpdev/api.hpdev.name.vn"
            cd "$TARGET_DIR"

            if [ -f "api.tar.gz" ]; then
              tar -xzf api.tar.gz -C "$TARGET_DIR"
              rm -f api.tar.gz
            fi

            # Kích hoạt môi trường NodeJS cPanel
            source /home/hpdev/nodevenv/ai.hpdev.name.vn/19/bin/activate

            echo "==> Cài đặt dependencies..."
            npm install --omit=dev --no-audit --no-fund

            echo "==> Nạp cơ sở dữ liệu câu hỏi vào MySQL..."
            node scripts/seed-tech-learning.js || true
            node scripts/seed-tech-fundamentals.js || true

            # Dọn dẹp file rác macOS
            find "$TARGET_DIR" -name '._*' -delete 2>/dev/null || true

            # Khởi động lại Passenger NodeJS
            mkdir -p "$TARGET_DIR/tmp" && touch "$TARGET_DIR/tmp/restart.txt"
            echo "==> [API] Deploy hoàn tất siêu tốc lúc $(date)!"
