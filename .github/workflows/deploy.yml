name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - ai
      - openclaw
  pull_request:
    branches:
      - main
      - ai
      - openclaw
  workflow_dispatch:

jobs:
  docker-package:
    name: Build & Package Docker Image
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image & package
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ env.DOCKERHUB_USERNAME != '' && github.event_name != 'pull_request' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME || 'hpdev' }}/openclaw:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME || 'hpdev' }}/openclaw:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Server
    needs: [docker-package]
    if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'ai' || github.ref_name == 'openclaw')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            set -e
            BRANCH="${{ github.ref_name }}"
            if [ "$BRANCH" = "main" ]; then
              cd /home/hpdev/public_html
              git pull origin main
              echo "Deploy completed at $(date)"

            elif [ "$BRANCH" = "ai" ]; then
              cd ~/ai.hpdev.name.vn
              git pull origin ai
              source ~/nodevenv/ai.hpdev.name.vn/19/bin/activate
              npm install --prefer-offline --no-audit --no-fund
              mkdir -p tmp && touch tmp/restart.txt
              which pm2 || npm install -g pm2
              pm2 reload bot 2>/dev/null || pm2 restart bot 2>/dev/null || pm2 start bot.js --name bot || true
              pm2 save 2>/dev/null || true

            elif [ "$BRANCH" = "openclaw" ]; then
              cd ~/openclaw.hpdev.name.vn
              git fetch origin openclaw
              
              # Chỉ npm install nếu package.json có thay đổi
              if [ ! -d "node_modules" ] || git diff --name-only HEAD origin/openclaw 2>/dev/null | grep -q 'package.json'; then
                echo "==> Phát hiện thay đổi trong package.json, cập nhật dependencies..."
                npm install --prefer-offline --no-audit --no-fund
              else
                echo "==> package.json không đổi, bỏ qua npm install!"
              fi

              git pull --ff-only origin openclaw
              npm run migrate
              
              # Chỉ tải Chromium cho Playwright nếu trên server chưa có cache
              if [ ! -d "$HOME/.cache/ms-playwright" ]; then
                echo "==> Cài đặt Chromium cho Playwright lần đầu..."
                npx playwright install chromium 2>/dev/null || true
              fi

              mkdir -p tmp && touch tmp/restart.txt
              echo "==> Deploy openclaw hoàn tất siêu tốc lúc $(date)!"
            fi
