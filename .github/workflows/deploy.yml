name: Build & Deploy Dan Manager (ai.hpdev.name.vn)

on:
  push:
    branches:
      - ai
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build on GitHub & Deploy Static Dist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Vue 3 App (Free GitHub Runners)
        run: |
          npm ci || npm install
          npm run build

      - name: Deploy Dist to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          timeout: 60s
          command_timeout: 10m
          script: |
            TARGET_DIR="/home/hpdev/ai.hpdev.name.vn"
            mkdir -p "$TARGET_DIR"
            
            # Xóa node_modules thừa trên server nếu có để giải phóng 100% dung lượng
            if [ -d "$TARGET_DIR/node_modules" ]; then
              echo "==> Xóa node_modules thừa trên server..."
              rm -rf "$TARGET_DIR/node_modules"
            fi

      - name: Upload Static Files to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          source: "dist/*"
          target: "/home/hpdev/ai.hpdev.name.vn"
          strip_components: 1

      - name: Touch Restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            mkdir -p /home/hpdev/ai.hpdev.name.vn/tmp
            touch /home/hpdev/ai.hpdev.name.vn/tmp/restart.txt
            echo "==> Deploy Frontend Vue 3 hoàn tất! Server không tốn 1MB node_modules nào."
